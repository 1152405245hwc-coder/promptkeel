<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>dsh-forge · UI Preview</title>
<style>
:root{--bg:#0d1014;--panel:#141920;--panel2:#1a212a;--line:#26303b;--text:#e6edf3;--dim:#8b98a5;--amber:#f0b35b;--green:#5fd39b;--red:#ef6b73;--blue:#6cb6ff}
*{box-sizing:border-box}body{margin:0;background:#07090c;color:var(--text);font:13px/1.5 "SF Pro Text","PingFang SC",system-ui,sans-serif}
.wrap{max-width:1080px;margin:32px auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;display:flex;flex-direction:column;background:var(--bg)}
.head{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#151b22,#10151b)}
.logo{font:700 15px/1 "SF Mono",ui-monospace,monospace;letter-spacing:.12em;color:var(--amber)}
.pill{padding:3px 9px;border-radius:999px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.pill.ok{color:var(--green);border-color:rgba(95,211,155,.35);background:rgba(95,211,155,.08)}
.spacer{flex:1}
button{font:inherit}.btn{padding:6px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.btn.primary{border-color:rgba(240,179,91,.5);background:rgba(240,179,91,.12);color:var(--amber)}
.tabs{display:flex;padding:0 14px;border-bottom:1px solid var(--line);background:#11161c}
.tab{padding:10px 14px;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:0;border-left:0;border-right:0}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.body{flex:1;overflow:auto;padding:18px 20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .k{font-size:11px;color:var(--dim);margin-bottom:6px}.card .v{font:600 20px/1.1 "SF Mono",ui-monospace,monospace}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.sec h3{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.08em;color:var(--dim);border-bottom:1px solid var(--line);background:var(--panel2)}
.row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(38,48,59,.55)}.row:last-child{border-bottom:0}
.dot{width:7px;height:7px;border-radius:50%;flex:none}.dot.ok{background:var(--green)}.dot.warn{background:var(--amber)}.dot.fail{background:var(--red)}
.name{width:180px;flex:none}.detail{color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:11px;color:var(--dim);padding:8px 14px;border-bottom:1px solid var(--line)}
td{padding:9px 14px;border-bottom:1px solid rgba(38,48,59,.55)}tr:last-child td{border-bottom:0}
.mono{font-family:"SF Mono",ui-monospace,monospace;font-size:12px}
.badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
.badge.applied{color:var(--green);border-color:rgba(95,211,155,.35)}.badge.hit{color:var(--blue);border-color:rgba(108,182,255,.35)}
pre{margin:0;padding:14px;background:#0a0e12;max-height:420px;overflow:auto;font:12px/1.55 "SF Mono",ui-monospace,monospace;color:#c8d3de;white-space:pre-wrap}
.policy{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}.opt.on{border-color:var(--amber);background:rgba(240,179,91,.06)}
.opt b{display:block;margin-bottom:6px}.opt span{color:var(--dim);font-size:12px}
.log{padding:7px 14px;border-bottom:1px solid rgba(38,48,59,.45);font:12px/1.5 "SF Mono",ui-monospace,monospace;color:#b9c6d2}
.log time{color:var(--dim);margin-right:10px}
.toolbar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div class="logo">DSH FORGE</div><span class="pill ok">PASS</span><span class="pill">DSH 0.2.2-rc.2</span><div class="spacer"></div><button class="btn">刷新</button></div>
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
</div>
<script>
const tabs=[["overview","总览"],["patches","补丁"],["prompt","提示词"],["policy","策略"],["logs","日志"]];
const checks=[["host-root","宿主目录","/Applications/DeepSeek Harness.app/Contents/Resources/app/dsh","ok"],["host-version","宿主版本","0.2.2-rc.2","ok"],["patches","补丁锚点","8/8 ready","ok"],["prompt-file","提示词核心","built-in (c061a43782bf)","ok"],["prompt-budget","提示词预算","693 / 3200 tokens","ok"],["inject-source","注入来源","section forge:prompt (builtin)","ok"],["session-runtime","运行时会话","readable","ok"],["plugin-conflicts","插件冲突","none","ok"],["profile-bundle","Profile 包","dsh-forge","ok"],["backup-dir","备份目录","~/.dsh/dsh-forge/backups","ok"],["ui-bundle","UI bundle","15320 bytes","ok"],["workspace-policy","Workspace 策略","fallback","ok"]];
const patches=[["approval-config-default","默认审批模式","applied","dsh-user-approval/lib/index.js",1],["approval-auto-grant","never 策略放行","applied","dsh-user-approval/lib/index.js",1],["approval-ask-sentence","ask 提示句","applied","dsh-user-approval/lib/index.js",1],["approval-never-sentence","never 提示句","applied","dsh-user-approval/lib/index.js",1],["escalation-bypass","提权三连放行","applied","dsh-sandbox/lib/index.js",1],["sandbox-default-full","默认全权限沙箱","applied","dsh-sandbox-policy/lib/index.js",1],["workspace-intro-precedence","指令优先级","applied","dsh-agent-instructions/lib/index.js",1],["approval-types-sentences","类型句子常量","applied","dsh-user-approval/lib/types/index.js",1]];
const promptPreview=`<!-- dsh-forge v0.1.0 sha256:c061a43782bf -->\n# 运行核心\n\n你是用户授权的本地执行代理。直接完成交付：读文件、跑命令、改代码、给结果；必要说明放在产物之后。\n\n## 1. 任务路由\n| 请求类型 | 执行步骤 | 交付物 |\n...`;
let active="overview";
function render(){
  document.getElementById("tabs").innerHTML=tabs.map(([id,l])=>`<button class="tab ${id===active?"on":""}" onclick="go('${id}')">${l}</button>`).join("");
  const b=document.getElementById("body");
  if(active==="overview") b.innerHTML=`<div class="cards"><div class="card"><div class="k">宿主版本</div><div class="v">0.2.2-rc.2</div></div><div class="card"><div class="k">补丁</div><div class="v">8/8</div></div><div class="card"><div class="k">提示词预算</div><div class="v">693</div></div><div class="card"><div class="k">策略</div><div class="v">fallback</div></div></div><section class="sec"><h3>体检 · 12/12 通过</h3>${checks.map(([id,n,d,s])=>`<div class="row"><i class="dot ${s}"></i><span class="name">${n}</span><span class="detail">${d}</span></div>`).join("")}</section>`;
  if(active==="patches") b.innerHTML=`<div class="toolbar"><button class="btn">预检</button><button class="btn primary">应用全部</button><button class="btn">刷新补丁</button><button class="btn">回滚</button><div class="spacer"></div><span class="pill">8 条</span></div><section class="sec"><table><thead><tr><th>ID</th><th>标题</th><th>状态</th><th>文件</th><th>命中</th></tr></thead><tbody>${patches.map(([id,t,s,f,m])=>`<tr><td class="mono">${id}</td><td>${t}</td><td><span class="badge ${s}">${s}</span></td><td class="mono">${f}</td><td class="mono">${m}</td></tr>`).join("")}</tbody></table></section>`;
  if(active==="prompt") b.innerHTML=`<div class="toolbar"><button class="btn">重新生成</button><span class="pill">693 tokens / 3200</span><div class="spacer"></div><button class="btn primary">安装到 prompt-inject</button></div><section class="sec"><h3>组合预览 · 4815b33e149a</h3><pre>${promptPreview}</pre></section>`;
  if(active==="policy") b.innerHTML=`<div class="policy">${[["strict","严格接管","始终由 Forge 接管 workspace 提示词基线，忽略宿主默认引导"],["fallback","按需接管","存在自定义或 Forge 提示词时接管，否则保留宿主默认（默认）"],["always","并存保留","始终保留宿主 workspace 引导，与 Forge 提示词并存"]].map(([id,t,d])=>`<div class="opt ${id==="fallback"?"on":""}"><b>${t}</b><span>${d}</span></div>`).join("")}</div>`;
  if(active==="logs") b.innerHTML=`<section class="sec"><h3>forge.log.jsonl</h3>${[["15:47:02","apply","8 patches, backup 20261114-154702"],["15:47:03","verify","file proof ok"],["15:47:04","session","dsh-forge header found"],["15:48:11","policy","set fallback"]].map(([t,e,d])=>`<div class="log"><time>${t}</time>${e} ${d}</div>`).join("")}</section>`;
}
function go(id){active=id;render()}
render();
</script>
</body>
</html>
